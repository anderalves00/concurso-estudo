<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Mapa mental — RICD, Da Sede (art. 1º) e o mesmo assunto em outros artigos</title>
  <defs>
    <filter id="marca" x="-0.04" y="-0.12" width="1.08" height="1.3"><feFlood flood-color="#ffe066"/><feComposite in="SourceGraphic" operator="over"/></filter>
    <filter id="atencao" x="-0.04" y="-0.12" width="1.08" height="1.3"><feFlood flood-color="#ffc9d6"/><feComposite in="SourceGraphic" operator="over"/></filter>
  </defs>
  <rect width="1200" height="700" fill="#fbfaf7"/>
  <g stroke="#9aa4b2" stroke-width="2.5" fill="none">
    <path d="M600,350 C540,350 520,190 470,190"/>
    <path d="M600,350 C540,350 520,520 470,520"/>
    <path d="M600,350 C660,350 680,190 730,190"/>
    <path d="M600,350 C660,350 680,520 730,520"/>
  </g>
  <rect x="505" y="315" width="190" height="70" rx="35" fill="#1f2a37"/>
  <text x="600" y="346" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">DA SEDE</text>
  <text x="600" y="368" text-anchor="middle" font-size="13" fill="#cfd6df">RICD, art. 1º</text>

  <!-- 1 REGRA -->
  <rect x="30" y="90" width="440" height="200" rx="14" fill="#e8f1fb" stroke="#2f6fb3"/>
  <text x="250" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#2f6fb3">REGRA — caput</text>
  <g font-size="15" fill="#1f2a37">
    <text x="52" y="156">A Câmara tem sede na</text>
    <text x="52" y="180" font-weight="700" filter="url(#marca)">Capital Federal</text>
    <text x="52" y="214">e funciona no</text>
    <text x="52" y="238" font-weight="700" filter="url(#marca)">Palácio do Congresso Nacional.</text>
    <text x="52" y="272" font-size="13" fill="#5b6472">É o lugar normal de todas as reuniões.</text>
  </g>

  <!-- 2 EXCEÇÃO -->
  <rect x="30" y="410" width="440" height="270" rx="14" fill="#fff4ec" stroke="#b4532a"/>
  <text x="250" y="440" text-anchor="middle" font-size="17" font-weight="700" fill="#b4532a">EXCEÇÃO — parágrafo único</text>
  <g font-size="15" fill="#1f2a37">
    <text x="52" y="474">Quando: motivo relevante <tspan font-weight="700">OU</tspan> força maior</text>
    <text x="52" y="494" font-size="13" fill="#5b6472">(basta uma das causas)</text>
    <text x="52" y="530">Quem decide:</text>
    <text x="52" y="554" font-weight="700" filter="url(#atencao)">a Mesa, por deliberação</text>
    <text x="52" y="588">Como: a Câmara <tspan font-weight="700">poderá</tspan> (faculdade)</text>
    <text x="52" y="620">Confirma depois (ad referendum):</text>
    <text x="52" y="644" font-weight="700" filter="url(#marca)">maioria absoluta dos Deputados</text>
    <text x="52" y="670" font-size="13" fill="#5b6472">Para onde: outro edifício ou ponto diverso no território nacional</text>
  </g>

  <!-- 3 "sede" em outros artigos -->
  <rect x="730" y="60" width="440" height="250" rx="14" fill="#eef6ee" stroke="#3c7a46"/>
  <text x="950" y="90" text-anchor="middle" font-size="17" font-weight="700" fill="#3c7a46">"sede" em outros artigos do RICD</text>
  <g font-size="15" fill="#1f2a37">
    <text x="752" y="126" font-weight="700">Art. 4º — posse</text>
    <text x="752" y="150">Em 1º de fevereiro do 1º ano da legislatura,</text>
    <text x="752" y="172">os diplomados se reúnem em sessão preparatória</text>
    <text x="752" y="196" font-weight="700" filter="url(#marca)">na sede da Câmara.</text>
    <text x="752" y="234" font-weight="700">Art. 46 — Comissões</text>
    <text x="752" y="258">Reúnem-se <tspan font-weight="700">na sede da Câmara</tspan>; exceção:</text>
    <text x="752" y="282" font-weight="700" filter="url(#atencao)">CPI convocada para fora de Brasília.</text>
  </g>

  <!-- 4 "ad referendum" em outros artigos -->
  <rect x="730" y="360" width="440" height="320" rx="14" fill="#fdecef" stroke="#a3324a"/>
  <text x="950" y="390" text-anchor="middle" font-size="17" font-weight="700" fill="#a3324a">"ad referendum" em outros artigos</text>
  <g font-size="15" fill="#1f2a37">
    <text x="752" y="422" font-size="14" fill="#5b6472">Significa: a decisão vale já e é confirmada depois.</text>
    <text x="752" y="458" font-weight="700">Art. 15, § 1º — papéis invertidos</text>
    <text x="752" y="482">Em matéria inadiável de competência da Mesa,</text>
    <text x="752" y="506" font-weight="700" filter="url(#atencao)">o Presidente decide e a Mesa confirma depois.</text>
    <text x="752" y="530" font-size="13" fill="#5b6472">Não vale para o inciso XXX (suspensão cautelar de mandato).</text>
    <text x="752" y="570" font-weight="700">Art. 17, I, "o" — atribuição do Presidente</text>
    <text x="752" y="594">"deliberar, ad referendum da Mesa, nos termos</text>
    <text x="752" y="616">do parágrafo único do art. 15".</text>
    <text x="752" y="646" font-size="13" fill="#5b6472">O art. 15 hoje não tem parágrafo único: a regra citada</text>
    <text x="752" y="664" font-size="13" fill="#5b6472">é a do § 1º (remissão desatualizada no próprio Regimento).</text>
  </g>
</svg>
