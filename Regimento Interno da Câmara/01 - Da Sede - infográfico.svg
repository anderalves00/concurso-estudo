<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">RICD art. 1º — Da Sede</title>
  <desc id="d">Regra: a Câmara funciona no Palácio do Congresso Nacional, na Capital Federal. Exceção: com motivo relevante ou de força maior, a Mesa delibera, ad referendum da maioria absoluta dos Deputados, reunir em outro edifício ou ponto diverso do território nacional. Não confundir com o art. 15, § 1º, em que o Presidente decide ad referendum da Mesa.</desc>
  <defs>
    <!-- marca-texto: fundo colorido do tamanho do texto -->
    <filter id="marca" x="-0.04" y="-0.12" width="1.08" height="1.3"><feFlood flood-color="#ffe066"/><feComposite in="SourceGraphic" operator="over"/></filter>
    <filter id="atencao" x="-0.04" y="-0.12" width="1.08" height="1.3"><feFlood flood-color="#ffc9d6"/><feComposite in="SourceGraphic" operator="over"/></filter>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker>
  </defs>
  <rect width="960" height="660" fill="#fbfaf7"/>
  <text x="480" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2a37">Da Sede — RICD, art. 1º</text>
  <text x="480" y="74" text-anchor="middle" font-size="14" fill="#5b6472">amarelo = o que decide a questão · rosa = o que se confunde com outro trecho</text>

  <!-- REGRA -->
  <rect x="40" y="95" width="880" height="105" rx="14" fill="#e8f1fb" stroke="#2f6fb3"/>
  <text x="480" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fb3" letter-spacing="1">REGRA (caput)</text>
  <text x="290" y="160" text-anchor="middle" font-size="15" fill="#5b6472">sede</text>
  <text x="290" y="186" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2a37" filter="url(#marca)">Capital Federal</text>
  <text x="670" y="160" text-anchor="middle" font-size="15" fill="#5b6472">funciona no</text>
  <text x="670" y="186" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2a37" filter="url(#marca)">Palácio do Congresso Nacional</text>

  <!-- EXCEÇÃO -->
  <text x="480" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#b4532a" letter-spacing="1">EXCEÇÃO (parágrafo único) — a Câmara</text>
  <text x="480" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2a37" filter="url(#marca)">PODERÁ (faculdade, não dever)</text>

  <g text-anchor="middle" fill="#1f2a37">
    <rect x="40" y="275" width="200" height="150" rx="12" fill="#fff4ec" stroke="#b4532a"/>
    <text x="140" y="302" font-size="13" font-weight="700" fill="#b4532a">1 · QUANDO</text>
    <text x="140" y="340" font-size="16">motivo relevante</text>
    <text x="140" y="368" font-size="18" font-weight="700" filter="url(#marca)">OU</text>
    <text x="140" y="396" font-size="16">de força maior</text>
    <text x="140" y="416" font-size="12" fill="#5b6472">basta uma das duas</text>

    <rect x="265" y="275" width="200" height="150" rx="12" fill="#fff4ec" stroke="#b4532a"/>
    <text x="365" y="302" font-size="13" font-weight="700" fill="#b4532a">2 · QUEM DECIDE</text>
    <text x="365" y="350" font-size="22" font-weight="700" filter="url(#atencao)">a MESA</text>
    <text x="365" y="380" font-size="15">por deliberação</text>
    <text x="365" y="408" font-size="12" fill="#5b6472">não o Presidente sozinho</text>

    <rect x="490" y="275" width="210" height="150" rx="12" fill="#fff4ec" stroke="#b4532a"/>
    <text x="595" y="302" font-size="13" font-weight="700" fill="#b4532a">3 · CONFIRMA DEPOIS</text>
    <text x="595" y="334" font-size="17" font-style="italic" filter="url(#atencao)">ad referendum</text>
    <text x="595" y="356" font-size="12" fill="#5b6472">vale já; confirmação posterior</text>
    <text x="595" y="386" font-size="16" font-weight="700" filter="url(#marca)">maioria ABSOLUTA</text>
    <text x="595" y="408" font-size="15" font-weight="700" filter="url(#marca)">dos Deputados</text>

    <rect x="725" y="275" width="195" height="150" rx="12" fill="#fff4ec" stroke="#b4532a"/>
    <text x="822" y="302" font-size="13" font-weight="700" fill="#b4532a">4 · PARA ONDE</text>
    <text x="822" y="340" font-size="16">outro edifício</text>
    <text x="822" y="368" font-size="18" font-weight="700" filter="url(#marca)">OU</text>
    <text x="822" y="396" font-size="16">ponto diverso</text>
    <text x="822" y="416" font-size="13" font-weight="700" filter="url(#marca)">no território nacional</text>
  </g>
  <g stroke="#5b6472" stroke-width="2" marker-end="url(#seta)">
    <line x1="240" y1="350" x2="262" y2="350"/><line x1="465" y1="350" x2="487" y2="350"/><line x1="700" y1="350" x2="722" y2="350"/>
  </g>

  <!-- NÃO CONFUNDA: quadro comparativo -->
  <rect x="40" y="450" width="880" height="190" rx="14" fill="#fdecef" stroke="#a3324a" stroke-dasharray="6 4"/>
  <text x="480" y="478" text-anchor="middle" font-size="14" font-weight="700" fill="#a3324a" letter-spacing="1">NÃO CONFUNDA — "ad referendum" aparece com papéis invertidos</text>
  <g text-anchor="middle" font-size="13" fill="#5b6472" font-weight="700">
    <text x="190" y="508">ONDE</text><text x="455" y="508">QUEM DECIDE</text><text x="740" y="508">QUEM CONFIRMA DEPOIS</text>
  </g>
  <line x1="60" y1="518" x2="900" y2="518" stroke="#e7b8c3"/>
  <g text-anchor="middle" fill="#1f2a37">
    <text x="190" y="550" font-size="16">art. 1º, parágrafo único</text>
    <text x="455" y="550" font-size="18" font-weight="700" filter="url(#atencao)">a MESA</text>
    <text x="740" y="550" font-size="18" font-weight="700" filter="url(#atencao)">a maioria absoluta dos Deputados</text>
    <text x="190" y="592" font-size="16">art. 15, § 1º</text>
    <text x="455" y="592" font-size="18" font-weight="700" filter="url(#atencao)">o PRESIDENTE</text>
    <text x="740" y="592" font-size="18" font-weight="700" filter="url(#atencao)">a MESA</text>
    <text x="480" y="626" font-size="12" fill="#5b6472">art. 15, § 1º: só em matéria inadiável de competência da Mesa — e não vale para o inciso XXX (suspensão cautelar de mandato)</text>
  </g>
</svg>
