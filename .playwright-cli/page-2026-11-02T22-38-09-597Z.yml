              - heading "Texto" [level=2] [ref=e319]
              - blockquote [ref=e320]:
                - paragraph [ref=e321]:
                  - strong [ref=e322]: Art. 5º
                  - text: Na segunda sessão preparatória da primeira sessão legislativa de cada legislatura, no dia 1º de fevereiro, sempre que possível sob a direção da Mesa da sessão anterior, realizar-se-á a eleição do Presidente, dos demais membros da Mesa e dos Suplentes dos Secretários, para mandato de dois anos, vedada a recondução para o mesmo cargo na eleição imediatamente subsequente. (“Caput” do artigo com redação dada pela Resolução nº 19, de 2012)
                - paragraph [ref=e323]:
                  - strong [ref=e324]: § 1º
                  - text: Não se considera recondução a eleição para o mesmo cargo em legislaturas diferentes, ainda que sucessivas.
                - paragraph [ref=e325]:
                  - strong [ref=e326]: § 2º
                  - text: Enquanto não for escolhido o Presidente, não se procederá à apuração para os demais cargos.
                - paragraph [ref=e327]:
                  - strong [ref=e328]: Art. 6º
                  - text: No terceiro ano de cada legislatura, em data e hora previamente designadas pelo Presidente da Câmara dos Deputados, antes de inaugurada a sessão legislativa e sob a direção da Mesa da sessão anterior, realizar-se-á a eleição do Presidente, dos demais membros da Mesa e dos Suplentes dos Secretários.
