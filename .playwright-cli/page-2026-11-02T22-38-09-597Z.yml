                  - text: (Revogado).
                - paragraph [ref=e331]:
                  - strong [ref=e332]: § 2º
                  - text: (Revogado).
                - paragraph [ref=e333]:
                  - strong [ref=e334]: § 3º
                  - text: Enquanto não for eleito o novo Presidente, dirigirá os trabalhos da Câmara dos Deputados a Mesa da sessão legislativa anterior. (Artigo com redação dada pela Resolução nº 19, de 2012)
                - paragraph [ref=e335]:
                  - strong [ref=e336]: Art. 7º
                  - text: "A eleição dos membros da Mesa far-se-á em votação por escrutínio secreto e pelo sistema eletrônico, exigido maioria absoluta de votos, em primeiro escrutínio, e maioria simples, em segundo escrutínio, presente a maioria absoluta dos Deputados, observadas as seguintes exigências e formalidades:"
                - paragraph [ref=e337]:
                  - strong [ref=e338]: I -
                  - text: registro, perante a Mesa, individualmente ou por chapa, de candidatos previamente escolhidos pelas bancadas dos Partidos ou Blocos Parlamentares aos cargos que, de acordo com o principio da representação proporcional, tenham sido distribuídos a esses Partidos ou Blocos Parlamentares;
