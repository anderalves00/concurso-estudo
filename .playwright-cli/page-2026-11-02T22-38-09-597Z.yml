                - paragraph [ref=e343]:
                  - strong [ref=e344]: IV -
                  - text: eleição do candidato mais idoso, dentre os de maior número de legislaturas, em caso de empate;
                - paragraph [ref=e345]:
                  - strong [ref=e346]: V -
                  - text: proclamação pelo Presidente do resultado final e posse imediata dos eleitos.
                - paragraph [ref=e347]:
                  - strong [ref=e348]: Parágrafo único.
                  - text: "No caso de avaria do sistema eletrônico de votação, far-se-á a eleição por cédulas, observados os incisos II a V do caput deste artigo e as seguintes exigências:"
                - paragraph [ref=e349]:
                  - strong [ref=e350]: I -
                  - text: cédulas impressas ou datilografadas, contendo cada uma somente o nome do votado e o cargo a que concorre, embora seja um só o ato de votação para todos os cargos, ou chapa completa, desde que decorrente de acordo partidário;
                - paragraph [ref=e351]:
                  - strong [ref=e352]: II -
                  - text: colocação, em cabina indevassável, das cédulas em sobrecartas que resguardem o sigilo do voto;
                - paragraph [ref=e353]:
                  - strong [ref=e354]: III -
                  - text: colocação das sobrecartas em 4 (quatro) urnas, à vista do Plenário, 2 (duas) destinadas à eleição do Presidente e as outras 2 (duas) à eleição dos demais membros da Mesa;
                - paragraph [ref=e355]:
                  - strong [ref=e356]: IV -
                  - text: acompanhamento dos trabalhos de apuração, na Mesa, por 2 (dois) ou mais Deputados indicados à Presidência por Partidos ou Blocos Parlamentares diferentes e por candidatos avulsos;
                - paragraph [ref=e357]:
                  - strong [ref=e358]: V -
                  - text: o Secretário designado pelo Presidente retirará as sobrecartas das urnas, em primeiro lugar as destinadas à eleição do Presidente; contá-las-á e, verificada a coincidência do seu número com o dos votantes, do que será cientificado o Plenário, abri-las-á e separará as cédulas pelos cargos a preencher;
                - paragraph [ref=e359]:
                  - strong [ref=e360]: VI -
                  - text: leitura pelo Presidente dos nomes dos votados;
                - paragraph [ref=e361]:
                  - strong [ref=e362]: VII -
                  - text: proclamação dos votos, em voz alta, por um Secretário e sua anotação por 2 (dois) outros, à medida que apurados;
                - paragraph [ref=e363]:
                  - strong [ref=e364]: VIII -
                  - text: invalidação da cédula que não atenda ao disposto no inciso I deste parágrafo;
                - paragraph [ref=e365]:
                  - strong [ref=e366]: IX -
                  - text: redação pelo Secretário e leitura pelo Presidente do resultado de cada eleição, na ordem decrescente dos votados. (Artigo com redação dada pela Resolução nº 45, de 2006)
                - paragraph [ref=e367]:
                  - strong [ref=e368]: Art. 8º
                  - text: "Na composição da Mesa será assegurada, tanto quanto possível, a representação proporcional dos Partidos ou Blocos Parlamentares que participem da Câmara, os quais escolherão os respectivos candidatos aos cargos que, de acordo com o mesmo princípio, lhes caiba prover, sem prejuízo de candidaturas avulsas oriundas das mesmas bancadas, observadas as seguintes regras:"
                - paragraph [ref=e369]:
                  - strong [ref=e370]: I -
                  - text: a escolha será feita na forma prevista no estatuto de cada Partido, ou conforme o estabelecer a própria bancada e, ainda, segundo dispuser o ato de criação do Bloco Parlamentar;
                - paragraph [ref=e371]:
                  - strong [ref=e372]: II -
                  - text: em caso de omissão, ou se a representação não fizer a indicação, caberá ao respectivo
                  - mark [ref=e373]: Líder
                  - text: fazê-la;
                - paragraph [ref=e374]:
                  - strong [ref=e375]: III -
                  - text: o resultado da eleição ou a escolha constará de ata ou documento hábil, a ser enviado de imediato ao Presidente da Câmara, para publicação;
                - paragraph [ref=e376]:
                  - strong [ref=e377]: IV -
                  - text: independentemente do disposto nos incisos anteriores, qualquer Deputado poderá concorrer aos cargos da Mesa que couberem à sua representação, mediante comunicação por escrito ao Presidente da Câmara, sendo-lhe assegurado o tratamento conferido aos demais candidatos.
                - paragraph [ref=e378]:
                  - strong [ref=e379]: § 1º
                  - text: Salvo composição diversa resultante de acordo entre as bancadas, a distribuição dos cargos da Mesa far-se-á por escolha das
                  - mark [ref=e380]: Lider
                  - text: anças, da maior para a de menor representação, conforme o número de cargos que corresponda a cada uma delas.
                - paragraph [ref=e381]:
                  - strong [ref=e382]: § 2º
                  - text: Se até 30 de novembro do segundo ano de mandato verificar-se qualquer vaga na Mesa, será ela preenchida mediante eleição, dentro de cinco sessões, observadas as disposições do artigo precedente. Ocorrida a vacância depois dessa data, a Mesa designará um dos membros titulares para responder pelo cargo.
                - paragraph [ref=e383]:
                  - strong [ref=e384]: § 3º
                  - text: É assegurada a participação de um membro da Minoria, ainda que pela proporcionalidade não lhe caiba lugar.
                - paragraph [ref=e385]:
                  - strong [ref=e386]: § 4º
                  - text: As vagas de cada Partido ou Bloco Parlamentar na composição da Mesa serão definidas com base no número de candidatos eleitos pela respectiva agremiação, na conformidade do resultado final das eleições proclamado pela Justiça Eleitoral, desconsideradas as mudanças de filiação partidária posteriores a esse ato. (Parágrafo acrescido pela Resolução nº 34, de 2005, em vigor a partir de 1º/2/2007)
                - paragraph [ref=e387]:
                  - strong [ref=e388]: § 5º
                  - text: Em caso de mudança de legenda partidária, o membro da Mesa perderá automaticamente o cargo que ocupa, aplicando-se para o preenchimento da vaga o disposto no § 2º deste artigo. (Parágrafo acrescido pela Resolução nº 34, de 2005, em vigor a partir de 1º/2/2007)
