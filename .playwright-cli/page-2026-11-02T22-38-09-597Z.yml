        - group [ref=e1965]:
          - generic "▸ 07 · Da Bancada Negra (art. 13-A e art. 13-B)" [ref=e1966] [cursor=pointer]
          - generic [ref=e1967]:
            - generic [ref=e1968]:
              - text: Edital da Câmara · Noções de Direito Constitucional e de Regimento Interno da Câmara dos Deputados
              - text: 7 Regimento Interno da Câmara dos Deputados
              - text: 7.1 Disposições preliminares e Órgãos da Câmara (arts. 1º a 24 e suas alterações).
            - heading "Texto" [level=2] [ref=e1969]
            - blockquote [ref=e1970]:
              - paragraph [ref=e1971]:
                - strong [ref=e1972]: Art. 13-A.
                - text: A Bancada Negra, composta de parlamentares negros e negras, é constituída de 1 (uma) Coordenação-Geral e 3 (três) Vices-Coordenadorias, para mandato de 1 (um) ano, até a posse dos novos integrantes, salvo na última sessão legislativa da legislatura, cujo encerramento fará cessar os mandatos na Bancada, permitida uma única recondução, por igual período, durante a mesma legislatura. (“Caput” do artigo acrescido pela Resolução nº 6, de 2023, e com redação dada pela Resolução nº 33, de 2026)
              - paragraph [ref=e1973]:
                - strong [ref=e1974]: § 1º
                - text: As Vices-Coordenadorias terão a designação de Primeira, Segunda e Terceira e, nessa ordem, substituirão a Coordenação-Geral em casos de impedimentos ou ausência do titular. (Parágrafo acrescido pela Resolução nº 6, de 2023)
              - paragraph [ref=e1975]:
                - strong [ref=e1976]: § 2º
                - text: A eleição da Coordenação-Geral e das respectivas Vices-Coordenadorias ocorrerá no dia 6 de fevereiro de cada sessão legislativa, observado o disposto no § 1º do art. 2º deste Regimento, e será realizada por meio de reunião presencial convocada especificamente para essa finalidade. (Parágrafo acrescido pela Resolução nº 6, de 2023, e com redação dada pela Resolução nº 33, de 2026)
              - paragraph [ref=e1977]:
                - strong [ref=e1978]: § 2º
                - text: "-A A eleição de que trata o § 2º deste artigo far-se-á, preferencialmente, por meio de escrutínio secreto, exigida a maioria simples de votos dos membros da Bancada Negra presentes na reunião, admitida a eleição por aclamação quando houver consenso entre os presentes. (Parágrafo acrescido pela Resolução nº 33, de 2026)"
              - paragraph [ref=e1979]:
                - strong [ref=e1980]: § 3º
                - text: Para fins do disposto neste artigo, será considerada a autodeclaração racial lançada no formulário do registro de candidatura da eleição geral que precede o início da legislatura. (Parágrafo acrescido pela Resolução nº 6, de 2023)
              - paragraph [ref=e1981]:
                - strong [ref=e1982]: Art. 13-B.
                - text: "Compete à Bancada Negra, além de zelar pela participação de seus deputados e deputadas nos órgãos e nas atividades da Câmara dos Deputados:"
              - paragraph [ref=e1983]:
                - strong [ref=e1984]: I -
                - text: participar, com os
                - mark [ref=e1985]: Líder
                - text: es, das reuniões convocadas pelo Presidente da Câmara dos Deputados, com direito a voz e voto;
              - paragraph [ref=e1986]:
                - strong [ref=e1987]: II -
                - text: usar da palavra, pessoalmente ou por delegação, durante o período destinado às Comunicações de
                - mark [ref=e1988]: Lider
                - text: ança, por 5 (cinco) minutos, semanalmente, para dar expressão à posição de parlamentares negros e negras da Casa quanto à votação de proposições e conhecimento das ações de interesse da bancada. (Artigo acrescido pela Resolução nº 6, de 2023)
