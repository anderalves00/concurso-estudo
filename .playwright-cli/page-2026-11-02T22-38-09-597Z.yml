              - paragraph [ref=e902]:
                - strong [ref=e903]: II -
                - text: inscrever membros da bancada para o horário destinado às Comunicações Parlamentares;
              - paragraph [ref=e904]:
                - strong [ref=e905]: III -
                - text: participar, pessoalmente ou por intermédio dos seus Vice-
                - mark [ref=e906]: Líder
                - text: es, dos trabalhos de qualquer Comissão de que não seja membro, sem direito a voto, mas podendo encaminhar a votação ou requerer verificação desta;
              - paragraph [ref=e907]:
                - strong [ref=e908]: IV -
                - text: encaminhar a votação de qualquer proposição sujeita à deliberação do Plenário, para orientar sua bancada, por tempo não superior a um minuto;
              - paragraph [ref=e909]:
                - strong [ref=e910]: V -
                - text: registrar os candidatos do Partido ou Bloco Parlamentar para concorrer aos cargos da Mesa, e atender ao que dispõe o inciso III do art. 8º;
              - paragraph [ref=e911]:
