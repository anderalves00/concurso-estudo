            - blockquote [ref=e873]:
              - paragraph [ref=e874]:
                - strong [ref=e875]: Art. 9º
                - text: Os Deputados são agrupados por representações partidárias ou de Blocos Parlamentares, cabendo-lhes escolher o
                - mark [ref=e876]: Líder
                - text: quando a representação atender os requisitos estabelecidos no § 3º do art. 17 da Constituição Federal. (“Caput” do artigo com redação dada pela Resolução nº 30, de 2018, em vigor em 1º/2/2019, aplicando-se nos termos do art. 6º da Resolução nº 30, de 2018)
              - paragraph [ref=e877]:
                - strong [ref=e878]: § 1º
                - text: Cada
                - mark [ref=e879]: Líder
                - text: poderá indicar Vice-
                - mark [ref=e880]: Líder
                - text: es, na proporção de um por quatro Deputados, ou fração, que constituam sua representação, facultada a designação de um como Primeiro Vice-
                - mark [ref=e881]: Líder
                - text: . (Parágrafo com redação dada pela Resolução nº 78, de 1995)
              - paragraph [ref=e882]:
                - strong [ref=e883]: § 2º
                - text: A escolha do
                - mark [ref=e884]: Líder
                - text: será comunicada à Mesa, no início de cada legislatura, ou após a criação de Bloco Parlamentar, em documento subscrito pela maioria absoluta dos integrantes da representação.
              - paragraph [ref=e885]:
                - strong [ref=e886]: § 3º
                - text: Os
                - mark [ref=e887]: Líder
                - text: es permanecerão no exercício de suas funções até que nova indicação venha a ser feita pela respectiva representação.
              - paragraph [ref=e888]:
                - strong [ref=e889]: § 4º
                - text: O Partido que não atenda o disposto no caput deste artigo não terá
                - mark [ref=e890]: Lider
                - text: ança, mas poderá indicar um de seus integrantes para expressar a posição do Partido no momento da votação de proposições, ou para fazer uso da palavra, uma vez por semana, por cinco minutos, durante o período destinado às Comunicações de
                - mark [ref=e891]: Lider
                - text: anças. (Parágrafo com redação dada pela Resolução nº 30, de 2018, em vigor em 1º/2/2019, aplicando-se nos termos art. 6º da Resolução nº 30, de 2018)
              - paragraph [ref=e892]:
                - strong [ref=e893]: § 5º
                - text: (Revogado pela Resolução nº 33, de 2026)
              - paragraph [ref=e894]:
                - strong [ref=e895]: § 6º
                - text: O quantitativo mínimo de Vice-
                - mark [ref=e896]: Líder
                - text: es previsto no § 1º será calculado com base no resultado final das eleições para a Câmara dos Deputados proclamado pelo Tribunal Superior Eleitoral. (Parágrafo acrescido pela Resolução nº 1, de 2011)
              - paragraph [ref=e897]:
                - strong [ref=e898]: Art. 10.
                - text: O
                - mark [ref=e899]: Líder
                - text: ", além de outras atribuições regimentais, tem as seguintes prerrogativas:"
              - paragraph [ref=e900]:
                - strong [ref=e901]: I -
