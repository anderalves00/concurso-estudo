      - group [ref=e27]:
        - generic "▸ Capítulo IV — Dos Líderes" [ref=e28] [cursor=pointer]
        - group [ref=e29]:
          - generic "▸ 05 · Dos Líderes (art. 9º a art. 11-A)" [ref=e30] [cursor=pointer]
          - generic [ref=e31]:
            - generic [ref=e32]:
              - text: Edital da Câmara · Noções de Direito Constitucional e de Regimento Interno da Câmara dos Deputados
              - text: 7 Regimento Interno da Câmara dos Deputados
              - text: 7.1 Disposições preliminares e Órgãos da Câmara (arts. 1º a 24 e suas alterações).
            - heading "Texto" [level=2] [ref=e33]
            - blockquote [ref=e34]:
              - paragraph [ref=e35]:
                - strong [ref=e36]: Art. 9º
                - text: Os Deputados são agrupados por representações partidárias ou de Blocos Parlamentares, cabendo-lhes escolher o Líder quando a representação atender os requisitos estabelecidos no § 3º do art. 17 da Constituição Federal. (“Caput” do artigo com redação dada pela Resolução nº 30, de 2018, em vigor em 1º/2/2019, aplicando-se nos termos do art. 6º da Resolução nº 30, de 2018)
              - paragraph [ref=e37]:
                - strong [ref=e38]: § 1º
                - text: Cada Líder poderá indicar Vice-Líderes, na proporção de um por quatro Deputados, ou fração, que constituam sua representação, facultada a designação de um como Primeiro Vice-Líder. (Parágrafo com redação dada pela Resolução nº 78, de 1995)
              - paragraph [ref=e39]:
                - strong [ref=e40]: § 2º
                - text: A escolha do Líder será comunicada à Mesa, no início de cada legislatura, ou após a criação de Bloco Parlamentar, em documento subscrito pela maioria absoluta dos integrantes da representação.
              - paragraph [ref=e41]:
                - strong [ref=e42]: § 3º
                - text: Os Líderes permanecerão no exercício de suas funções até que nova indicação venha a ser feita pela respectiva representação.
              - paragraph [ref=e43]:
                - strong [ref=e44]: § 4º
                - text: O Partido que não atenda o disposto no caput deste artigo não terá Liderança, mas poderá indicar um de seus integrantes para expressar a posição do Partido no momento da votação de proposições, ou para fazer uso da palavra, uma vez por semana, por cinco minutos, durante o período destinado às
                - mark [ref=e45]: Comunicações de Liderança
                - text: s. (Parágrafo com redação dada pela Resolução nº 30, de 2018, em vigor em 1º/2/2019, aplicando-se nos termos art. 6º da Resolução nº 30, de 2018)
              - paragraph [ref=e46]:
                - strong [ref=e47]: § 5º
                - text: (Revogado pela Resolução nº 33, de 2026)
              - paragraph [ref=e48]:
                - strong [ref=e49]: § 6º
                - text: O quantitativo mínimo de Vice-Líderes previsto no § 1º será calculado com base no resultado final das eleições para a Câmara dos Deputados proclamado pelo Tribunal Superior Eleitoral. (Parágrafo acrescido pela Resolução nº 1, de 2011)
              - paragraph [ref=e50]:
                - strong [ref=e51]: Art. 10.
                - text: "O Líder, além de outras atribuições regimentais, tem as seguintes prerrogativas:"
              - paragraph [ref=e52]:
                - strong [ref=e53]: I -
                - text: fazer uso da palavra, nos termos do art. 66, §§ 1º e 3º, combinado com o art. 89; (Inciso adaptado aos termos da Resolução nº 3, de 1991, conforme republicação determinada pelo Ato da Mesa nº 71, de 2005)
              - paragraph [ref=e54]:
                - strong [ref=e55]: II -
                - text: inscrever membros da bancada para o horário destinado às Comunicações Parlamentares;
              - paragraph [ref=e56]:
                - strong [ref=e57]: III -
                - text: participar, pessoalmente ou por intermédio dos seus Vice-Líderes, dos trabalhos de qualquer Comissão de que não seja membro, sem direito a voto, mas podendo encaminhar a votação ou requerer verificação desta;
              - paragraph [ref=e58]:
                - strong [ref=e59]: IV -
                - text: encaminhar a votação de qualquer proposição sujeita à deliberação do Plenário, para orientar sua bancada, por tempo não superior a um minuto;
              - paragraph [ref=e60]:
                - strong [ref=e61]: V -
                - text: registrar os candidatos do Partido ou Bloco Parlamentar para concorrer aos cargos da Mesa, e atender ao que dispõe o inciso III do art. 8º;
              - paragraph [ref=e62]:
                - strong [ref=e63]: VI -
                - text: indicar à Mesa os membros da bancada para compor as Comissões, e, a qualquer tempo, substituí-los.
              - paragraph [ref=e64]:
                - strong [ref=e65]: Art. 11.
                - text: O Presidente da República poderá indicar Deputados para exercer a Liderança do Governo, composta de Líder e de 20 (vinte) Vice-Líderes, com as prerrogativas constantes dos incisos I, III e IV do caput do art. 10 deste Regimento. (Artigo com redação dada pela Resolução nº 2, de 2023)
              - paragraph [ref=e66]:
                - strong [ref=e67]: Art. 11-A.
                - text: A Liderança da Minoria será composta de Líder e de nove Vice-Líderes, com as prerrogativas constantes dos incisos I, III e IV do art. 10. (“Caput” do artigo acrescido pela Resolução nº 1, de 2011, com redação dada pela Resolução nº 17, de 2016)
              - paragraph [ref=e68]:
                - strong [ref=e69]: § 1º
                - text: O Líder de que trata este artigo será indicado pela representação considerada Minoria, nos termos do art. 13. (Parágrafo acrescido pela Resolução nº 1, de 2011)
              - paragraph [ref=e70]:
                - strong [ref=e71]: § 2º
                - text: Os nove Vice-Líderes serão indicados pelo Líder da Minoria a que se refere o § 1º, dentre os partidos que, em relação ao Governo, expressem posição contrária à da Maioria. (Parágrafo acrescido pela Resolução nº 1, de 2011, com redação dada pela Resolução nº 17, de 2016)
              - paragraph [ref=e72]:
                - strong [ref=e73]: § 3º
                - text: Aplica-se o disposto neste artigo sem prejuízo das prerrogativas do Líder e Vice-Líderes do Partido ou do Bloco Parlamentar considerado Minoria conforme o art. 13. (Parágrafo acrescido pela Resolução nº 1, de 2011)
