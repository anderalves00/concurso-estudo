        - generic "▸ Capítulo V — Dos Blocos Parlamentares, da Maioria e da Minoria" [ref=e678] [cursor=pointer]
        - group [ref=e679]:
          - generic "▸ 06 · Dos Blocos Parlamentares, da Maioria e da Minoria (art. 12 e art. 13)" [ref=e680] [cursor=pointer]
          - generic [ref=e681]:
            - generic [ref=e682]:
              - text: Edital da Câmara · Noções de Direito Constitucional e de Regimento Interno da Câmara dos Deputados
              - text: 7 Regimento Interno da Câmara dos Deputados
              - text: 7.1 Disposições preliminares e Órgãos da Câmara (arts. 1º a 24 e suas alterações).
            - heading "Texto" [level=2] [ref=e683]
            - blockquote [ref=e684]:
              - paragraph [ref=e685]:
                - strong [ref=e686]: Art. 12.
                - text: As representações de dois ou mais Partidos, por deliberação das respectivas bancadas, poderão constituir Bloco Parlamentar, sob Liderança comum.
              - paragraph [ref=e687]:
                - strong [ref=e688]: § 1º
                - text: O Bloco Parlamentar terá, no que couber, o tratamento dispensado por este Regimento às organizações partidárias com representação na Casa.
              - paragraph [ref=e689]:
                - strong [ref=e690]: § 2º
                - text: As Lideranças dos Partidos que se coligarem em Bloco Parlamentar perdem suas atribuições e prerrogativas regimentais.
              - paragraph [ref=e691]:
                - strong [ref=e692]: § 3º
                - text: Não será admitida a formação de Bloco Parlamentar composto de menos de três centésimos dos membros da Câmara.
              - paragraph [ref=e693]:
                - strong [ref=e694]: § 4º
                - text: Se o desligamento de uma bancada implicar a perda do quorum fixado no parágrafo anterior, extingue-se o Bloco Parlamentar.
              - paragraph [ref=e695]:
                - strong [ref=e696]: § 5º
                - text: O Bloco Parlamentar tem existência circunscrita à legislatura, devendo o ato de sua criação e as alterações posteriores ser apresentados à Mesa para registro e publicação.
              - paragraph [ref=e697]:
                - strong [ref=e698]: § 6º
                - text: (Revogado pela Resolução nº 34, de 2005, a partir de 1º/2/2007)
              - paragraph [ref=e699]:
                - strong [ref=e700]: § 7º
                - text: (Revogado em decorrência da revogação do § 6º pela Resolução nº 34, de 2005, em vigor a partir de 1º/2/2007, conforme republicação determinada pelo Ato da Mesa nº 71, de 2005)
              - paragraph [ref=e701]:
                - strong [ref=e702]: § 8º
                - text: A agremiação que integrava Bloco Parlamentar dissolvido, ou a que dele se desvincular, não poderá constituir ou integrar outro na mesma sessão legislativa.
              - paragraph [ref=e703]:
                - strong [ref=e704]: § 9º
                - text: A agremiação integrante de Bloco Parlamentar não poderá fazer parte de outro concomitantemente.
              - paragraph [ref=e705]:
                - strong [ref=e706]: § 10
                - text: . Para efeito do que dispõe o § 4º do art. 8º e o art. 26 deste Regimento, a formação do Bloco Parlamentar deverá ser comunicada à Mesa até o dia 1º de fevereiro do 1º (primeiro) ano da legislatura, com relação às Comissões e ao 1º (primeiro) biênio de mandato da Mesa, e até o dia 1º de fevereiro do 3º (terceiro) ano da legislatura, com relação ao 2º (segundo) biênio de mandato da Mesa. (Parágrafo acrescido pela Resolução nº 34, de 2005, em vigor a partir de 1º/2/2007)
              - paragraph [ref=e707]:
                - strong [ref=e708]: Art. 13.
